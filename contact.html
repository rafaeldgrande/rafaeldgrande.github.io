<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Rafael R. Del Grande</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <style>
    :root {
      --bg: #fafaf8;
      --header-bg: #ffffff;
      --border-color: #e8e8e6;
      --text: #2c2c2c;
      --title-color: #1a1a1a;
      --subtitle-color: #666;
      --accent: #800000;
      --link-color: #0066cc;
      --footer-color: #999;
      --shadow: rgba(0,0,0,0.08);
      --card-bg: #ffffff;
      --card-border: #f0f0f0;
      --social-bg: #f5f5f5;
      --social-color: #333;
    }

    html.dark {
      --bg: #111318;
      --header-bg: #1a1b26;
      --border-color: #2e3044;
      --text: #d4d8e8;
      --title-color: #f0f0f5;
      --subtitle-color: #8b90a8;
      --accent: #cc3333;
      --link-color: #4d99ff;
      --footer-color: #555;
      --shadow: rgba(0,0,0,0.25);
      --card-bg: #1e2030;
      --card-border: #2e3044;
      --social-bg: #252736;
      --social-color: #d4d8e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.3s ease, color 0.3s ease;
    }

    header {
      background: var(--header-bg);
      padding: 2em;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 4px var(--shadow);
      transition: background 0.3s ease, border-color 0.3s ease, padding 0.3s ease;
    }

    .title {
      font-size: 2.2em;
      margin: 0;
      font-weight: 700;
      color: var(--title-color);
      letter-spacing: -0.5px;
      transition: font-size 0.3s ease;
    }

    .subtitle {
      font-style: italic;
      font-size: 1.1em;
      margin-top: 0.3em;
      color: var(--subtitle-color);
      font-weight: 400;
      overflow: hidden;
      max-height: 3em;
      transition: opacity 0.3s ease, max-height 0.3s ease, margin-top 0.3s ease;
    }

    nav {
      margin-top: 1.2em;
      display: flex;
      gap: 2em;
      transition: margin-top 0.3s ease;
    }

    nav a {
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95em;
      position: relative;
      transition: color 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 3px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    section {
      padding: 3em 2em;
      max-width: 900px;
      margin: auto;
    }

    section h2 {
      font-size: 2.2em;
      margin-bottom: 2em;
      color: var(--title-color);
      font-weight: 600;
    }

    .contact-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2em;
      margin-bottom: 3em;
    }

    .contact-card {
      background: var(--card-bg);
      padding: 2em;
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.3s ease;
      border: 1px solid var(--card-border);
    }

    .contact-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px var(--shadow);
      border-color: var(--accent);
    }

    .contact-card h3 {
      color: var(--accent);
      margin-top: 0;
      margin-bottom: 0.8em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.85em;
    }

    .contact-card p {
      margin: 0.5em 0;
      line-height: 1.6;
    }

    .contact-card a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .contact-card a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .muted {
      font-size: 0.9em;
      color: var(--subtitle-color);
      margin-top: 1em;
    }

    .social-links {
      display: flex;
      gap: 1.2em;
      margin-top: 1.2em;
      flex-wrap: wrap;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.6em 1.2em;
      background: var(--social-bg);
      border-radius: 8px;
      color: var(--social-color);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 0.95em;
    }

    .social-links a:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-2px);
    }

    .social-links i {
      font-size: 1.2em;
    }

    footer {
      text-align: center;
      padding: 2em;
      font-size: 0.8em;
      color: var(--footer-color);
    }

    .header-container {
      display: flex;
      align-items: center;
      gap: 2em;
    }

    .profile-pic {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      object-fit: cover;
      flex-shrink: 0;
      overflow: hidden;
      transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
    }

    .title-container {
      flex: 1;
    }

    .theme-toggle {
      position: absolute;
      top: 1.2em;
      right: 1.5em;
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.4em 0.9em;
      font-size: 0.75em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      line-height: 1.6;
    }

    .theme-toggle:hover {
      background: var(--border-color);
    }

    header.scrolled {
      padding: 0.7em 2em;
    }

    header.scrolled .subtitle {
      opacity: 0;
      max-height: 0;
      margin-top: 0;
    }

    header.scrolled nav {
      margin-top: 0.3em;
    }

    @media (min-width: 769px) {
      header.scrolled .profile-pic {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        box-shadow: none;
      }

      header.scrolled .title {
        font-size: 1.1em;
      }
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 0.8em;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0.4em;
      flex-shrink: 0;
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--header-bg);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5em;
    }

    .mobile-menu.open {
      display: flex;
    }

    .mobile-menu a {
      font-size: 1.8em;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
    }

    .mobile-menu a:hover {
      opacity: 0.75;
    }

    .mobile-menu-close {
      position: absolute;
      top: 1.2em;
      right: 1.5em;
      background: none;
      border: none;
      font-size: 1.8em;
      cursor: pointer;
      color: var(--text);
      line-height: 1;
    }

    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        text-align: center;
        gap: 1.5em;
      }

      nav {
        flex-direction: column;
        gap: 0.8em;
        justify-content: center;
      }

      .title {
        font-size: 1.8em;
      }

      section {
        padding: 2em 1.5em;
      }

      .theme-toggle {
        top: 0.8em;
        right: 1em;
      }

      header.scrolled .profile-pic {
        width: 0;
        height: 0;
        opacity: 0;
        margin: 0;
      }

      header.scrolled .title {
        font-size: 1.1em;
      }

      header.scrolled .header-container {
        flex-direction: row;
        align-items: center;
        text-align: left;
        gap: 1em;
      }

      header.scrolled nav {
        display: none;
      }

      header.scrolled .hamburger {
        display: flex;
      }
    }
  </style>
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body>

<header>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">Dark Mode Off</button>
  <div class="header-container">
    <img src="pictures/profile.png" alt="Profile photo" class="profile-pic" />
    <div class="title-container">
      <div class="title-row">
        <button class="hamburger" id="hamburger" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <h1 class="title">Rafael R. Del Grande</h1>
      </div>
      <p class="subtitle">Computational Physicist</p>
      <nav>
        <a href="index.html" class="nav-link">Home</a>
        <a href="publications.html" class="nav-link">Publications</a>
        <a href="research.html" class="nav-link">Portfolio</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <button class="mobile-menu-close" id="mobileMenuClose">✕</button>
  <a href="index.html" class="nav-link">Home</a>
  <a href="publications.html" class="nav-link">Publications</a>
  <a href="research.html" class="nav-link">Portfolio</a>
  <a href="contact.html" class="nav-link">Contact</a>
</div>


    <section>
      <h2>Get in Touch</h2>

      <div class="contact-container">
        <div class="contact-card">
          <h3><i class="fas fa-envelope"></i> Email</h3>
          <p><a href="mailto:rafaeldgrande@gmail.com">rafaeldgrande@gmail.com</a></p>
        </div>

        <div class="contact-card">
          <h3><i class="fas fa-building"></i> Work email</h3>
          <p><a href="mailto:rdelgrande@ucmerced.edu">rdelgrande@ucmerced.edu</a></p>
        </div>

        <div class="contact-card">
          <h3><i class="fas fa-link"></i> Social Media</h3>
          <div class="social-links">
            <a href="https://www.linkedin.com/in/rafaeldelgrande/" target="_blank" title="LinkedIn">
              <i class="fab fa-linkedin"></i> LinkedIn
            </a>
            <a href="https://x.com/rafaeldelgrande" target="_blank" title="Twitter/X">
              <i class="fab fa-twitter"></i> Twitter
            </a>
            <a href="https://www.researchgate.net/profile/Rafael-Rodrigues-Del-Grande" target="_blank" title="ResearchGate">
              <i class="fab fa-researchgate"></i> ResearchGate
            </a>
          </div>
        </div>
      </div>
    </section>

  <footer>
    &copy; 2026 Rafael R. Del Grande
  </footer>

  <script>
    const toggle = document.getElementById('themeToggle');
    toggle.textContent = document.documentElement.classList.contains('dark') ? 'Dark Mode On' : 'Dark Mode Off';
    toggle.addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      this.textContent = isDark ? 'Dark Mode On' : 'Dark Mode Off';
    });

    window.addEventListener('scroll', function() {
      document.querySelector('header').classList.toggle('scrolled', window.scrollY > 60);
    });

    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    document.getElementById('mobileMenuClose').addEventListener('click', () => mobileMenu.classList.remove('open'));
    hamburger.addEventListener('click', () => mobileMenu.classList.add('open'));

    const path = window.location.pathname.split("/").pop();
    document.querySelectorAll(".nav-link").forEach(link => {
      if (link.getAttribute("href") === path || (path === "" && link.getAttribute("href") === "index.html")) {
        link.classList.add("active");
      }
    });
  </script>
</body>
</html>
